<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Entrando no CRM…</title></head>
<body style="font-family:sans-serif;background:#0b0e11;color:#ccc;display:grid;place-items:center;height:100vh;margin:0">
<p>Entrando no CRM…</p>
<script>
  // Recebe o token do RA Connect por postMessage (nunca pela URL) e abre o CRM já logado.
  var ORIGEM = '__ORIGEM_RA_CONNECT__';
  window.addEventListener('message', function (e) {
    if (e.origin !== ORIGEM || !e.data || typeof e.data.token !== 'string') return;
    try { localStorage.setItem('access_token', e.data.token); } catch (_) {}
    location.replace(e.data.caminho && e.data.caminho.charAt(0) === '/' ? e.data.caminho : '/');
  });
  var alvo = window.parent !== window ? window.parent : window.opener;
  if (alvo) alvo.postMessage({ crmPronto: true }, ORIGEM);
  else location.replace('/');
</script>
</body>
</html>
